<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        .test-section { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .image-item { text-align: center; }
        .image-item img { max-width: 100%; height: 150px; object-fit: cover; border: 1px solid #ddd; border-radius: 8px; }
        .image-info { margin-top: 10px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <h1>Image Display Verification</h1>
    
    <div class="test-section">
        <h2>Current Menu Items with Images</h2>
        <div id="menuItems">Loading...</div>
    </div>

    <script>
        async function loadMenuItems() {
            try {
                const response = await fetch('/restuarent/api/menu.php');
                const data = await response.json();
                
                if (data.success && data.items) {
                    const container = document.getElementById('menuItems');
                    
                    if (data.items.length === 0) {
                        container.innerHTML = '<p>No menu items found.</p>';
                        return;
                    }
                    
                    const grid = document.createElement('div');
                    grid.className = 'image-grid';
                    
                    data.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'image-item';
                        
                        const img = document.createElement('img');
                        if (item.image_url) {
                            img.src = item.image_url.startsWith('http') ? item.image_url : '/restuarent/' + item.image_url;
                            img.alt = item.name;
                            img.onerror = function() {
                                this.src = '/restuarent/images/placeholder.jpg';
                                this.style.border = '2px solid red';
                            };
                        } else {
                            img.src = '/restuarent/images/placeholder.jpg';
                            img.alt = 'No image';
                        }
                        
                        const info = document.createElement('div');
                        info.className = 'image-info';
                        info.innerHTML = `
                            <strong>${item.name}</strong><br>
                            Price: $${item.price}<br>
                            Category: ${item.category}<br>
                            Available: ${item.is_available ? 'Yes' : 'No'}<br>
                            Image URL: ${item.image_url || 'None'}
                        `;
                        
                        itemDiv.appendChild(img);
                        itemDiv.appendChild(info);
                        grid.appendChild(itemDiv);
                    });
                    
                    container.innerHTML = '';
                    container.appendChild(grid);
                } else {
                    document.getElementById('menuItems').innerHTML = '<p style="color: red;">Error loading menu items: ' + (data.message || 'Unknown error') + '</p>';
                }
            } catch (error) {
                document.getElementById('menuItems').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
        
        // Load items when page loads
        loadMenuItems();
    </script>
</body>
</html>
