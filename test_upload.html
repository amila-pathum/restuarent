<!DOCTYPE html>
<html>
<head>
    <title>Image Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
        .preview-img { max-width: 200px; max-height: 200px; margin: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Image Upload and Display Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Upload New Image</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <label>Menu Item Name:</label><br>
            <input type="text" name="name" value="Test Food Item" required><br><br>
            
            <label>Description:</label><br>
            <textarea name="description">A delicious test food item</textarea><br><br>
            
            <label>Price:</label><br>
            <input type="number" name="price" value="15.99" step="0.01" required><br><br>
            
            <label>Category:</label><br>
            <select name="category_id" required>
                <option value="1">Breakfast</option>
                <option value="2">Lunch</option>
                <option value="3">Dinner</option>
                <option value="4">Drinks</option>
            </select><br><br>
            
            <label>Image:</label><br>
            <input type="file" name="image" accept="image/*" required onchange="previewImage(this)"><br><br>
            
            <div id="preview"></div>
            
            <button type="submit">Upload Test Item</button>
        </form>
        
        <div id="uploadResult"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Recent Uploaded Images</h2>
        <div id="recentImages"></div>
    </div>

    <script>
        function previewImage(input) {
            const preview = document.getElementById('preview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = '<img src="' + e.target.result + '" class="preview-img" alt="Preview">';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultDiv = document.getElementById('uploadResult');
            
            resultDiv.innerHTML = '<p>Uploading...</p>';
            
            fetch('api/upload_image.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultDiv.innerHTML = '<p class="success">✅ Upload successful! Image URL: ' + data.image_url + '</p>';
                    loadRecentImages();
                } else {
                    resultDiv.innerHTML = '<p class="error">❌ Upload failed: ' + data.message + '</p>';
                }
            })
            .catch(error => {
                resultDiv.innerHTML = '<p class="error">❌ Error: ' + error.message + '</p>';
            });
        });        function loadRecentImages() {
            fetch('api/menu.php')
            .then(response => response.json())
            .then(data => {
                const recentDiv = document.getElementById('recentImages');
                if (data && Array.isArray(data) && data.length > 0) {
                    const recentItems = data.slice(-5); // Get last 5 items
                    recentDiv.innerHTML = '<h3>Last 5 uploaded items:</h3>' +
                        recentItems.map(item => 
                            '<div style="display: inline-block; margin: 10px; border: 1px solid #ccc; padding: 10px;">' +
                            '<img src="' + (item.image_url || 'images/popular/2.png') + '" class="preview-img" alt="' + item.name + '" onerror="this.src=\'images/popular/2.png\'">' +
                            '<br><strong>' + item.name + '</strong>' +
                            '<br>URL: ' + (item.image_url || 'No image') +
                            '</div>'
                        ).join('');
                } else {
                    recentDiv.innerHTML = '<p>No items found or error loading items</p>';
                }
            })
            .catch(error => {
                document.getElementById('recentImages').innerHTML = '<p class="error">Error loading recent images: ' + error.message + '</p>';
            });
        }

        // Load recent images on page load
        loadRecentImages();
    </script>
</body>
</html>
