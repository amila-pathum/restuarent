<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status Check</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .testing { background: #cce5ff; color: #004085; }
    </style>
</head>
<body>
    <h1>Restaurant System Status Check</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addStatus(message, type = 'testing') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        async function runTests() {
            addStatus('Starting system checks...');
            
            // Test 1: Basic API connectivity
            try {
                addStatus('Testing basic API connectivity...');
                const response = await fetch('api/test.php');
                const data = await response.json();
                addStatus(`✓ Basic API working: ${data.message}`, 'success');
            } catch (error) {
                addStatus(`✗ Basic API failed: ${error.message}`, 'error');
            }
            
            // Test 2: Admin auth API
            try {
                addStatus('Testing admin auth API...');
                const response = await fetch('api/admin_auth.php?action=validate');
                const data = await response.json();
                addStatus(`✓ Admin auth API accessible: ${JSON.stringify(data)}`, 'success');
            } catch (error) {
                addStatus(`✗ Admin auth API failed: ${error.message}`, 'error');
            }
            
            // Test 3: Database connectivity through API
            try {
                addStatus('Testing database connectivity...');
                const response = await fetch('api/menu.php');
                const data = await response.json();
                if (data.success) {
                    addStatus(`✓ Database connection working: Found ${data.items.length} menu items`, 'success');
                } else {
                    addStatus(`⚠ Database issues: ${data.message}`, 'warning');
                }
            } catch (error) {
                addStatus(`✗ Database connection failed: ${error.message}`, 'error');
            }
            
            // Test 4: Admin login simulation
            try {
                addStatus('Testing admin login...');
                const response = await fetch('api/admin_auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login',
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                const data = await response.json();
                if (data.success) {
                    addStatus(`✓ Admin login working: ${data.message}`, 'success');
                } else {
                    addStatus(`✗ Admin login failed: ${data.message}`, 'error');
                }
            } catch (error) {
                addStatus(`✗ Admin login request failed: ${error.message}`, 'error');
            }
            
            addStatus('System check complete!');
        }
        
        runTests();
    </script>
</body>
</html>
